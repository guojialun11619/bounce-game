<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>弹球大师 · Neon Bounce</title>
<style>
  :root {
    color-scheme: dark;
    --cyan: #4cc9f0;
    --violet: #7b61ff;
    --pink: #ff4d6d;
    --ink: #e8eeff;
    --muted: #8b98b8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1100px 760px at 50% -12%, #16224d 0%, rgba(22, 34, 77, 0) 62%),
      radial-gradient(900px 620px at 92% 112%, #2a1240 0%, rgba(42, 18, 64, 0) 58%),
      #05070f;
  }
  .shell {
    width: min(920px, 100%);
    width: min(920px, 100%, calc((100svh - 150px) * 4 / 3 + 32px));
    padding: 16px 16px 12px;
    border-radius: 24px;
    border: 1px solid rgba(120, 160, 255, 0.14);
    background: linear-gradient(180deg, rgba(14, 21, 44, 0.9), rgba(7, 11, 24, 0.92));
    box-shadow: 0 40px 120px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .hud {
    display: flex;
    align-items: center;
    gap: clamp(14px, 3vw, 30px);
    padding: 4px 6px 14px;
  }
  .stat { display: flex; flex-direction: column; gap: 2px; min-width: 52px; }
  .stat span {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #7f8db3;
  }
  .stat b {
    font-size: 20px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .stat.lives b { font-size: 17px; letter-spacing: 3px; }
  .lives .on { color: #ff5d7a; text-shadow: 0 0 12px rgba(255, 93, 122, 0.45); }
  .lives .off { color: #2a3350; }
  #soundBtn {
    margin-left: auto;
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: 12px;
    border: 1px solid rgba(120, 160, 255, 0.18);
    background: rgba(120, 160, 255, 0.08);
    font-size: 17px;
    cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  #soundBtn:hover { background: rgba(120, 160, 255, 0.16); }
  #soundBtn:active { transform: scale(0.94); }
  .stage {
    position: relative;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(110, 150, 255, 0.16);
    box-shadow: inset 0 0 70px rgba(40, 90, 200, 0.16);
    background: #070c1c;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
    cursor: crosshair;
    -webkit-user-select: none;
    user-select: none;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(4, 8, 20, 0.55);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .panel {
    width: calc(100% - 40px);
    max-width: 430px;
    padding: clamp(24px, 4vw, 38px) clamp(20px, 4vw, 34px);
    text-align: center;
    border-radius: 20px;
    border: 1px solid rgba(120, 170, 255, 0.18);
    background: linear-gradient(180deg, rgba(16, 24, 48, 0.94), rgba(9, 14, 30, 0.96));
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55), 0 0 60px rgba(76, 201, 240, 0.08);
  }
  .tag {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.34em;
    color: var(--cyan);
  }
  h1 {
    margin: 0 0 12px;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.15;
    letter-spacing: 0.02em;
    background: linear-gradient(100deg, #eaf6ff, #8fd8ff 46%, #b39dff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .desc {
    margin: 0 auto 24px;
    max-width: 330px;
    font-size: 14px;
    line-height: 1.75;
    color: #9aa8c7;
  }
  .primary {
    padding: 13px 42px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #041018;
    background: linear-gradient(135deg, #7ee7ff, #6ea8ff 55%, #a78bfa);
    box-shadow: 0 10px 30px rgba(90, 180, 255, 0.35);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .primary:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(90, 180, 255, 0.45); }
  .primary:active { transform: translateY(0); }
  .hint { margin: 18px 0 0; font-size: 12px; line-height: 1.6; color: #6d7a99; }
  .hint:empty { display: none; }
  .foot {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px 18px;
    padding: 12px 6px 2px;
    font-size: 12px;
    color: #6f7c9c;
  }
  kbd {
    padding: 1px 6px;
    border: 1px solid rgba(120, 160, 255, 0.2);
    border-bottom-width: 2px;
    border-radius: 6px;
    background: rgba(120, 160, 255, 0.1);
    font-family: inherit;
    font-size: 11px;
    color: #b8c6e6;
  }
  @media (max-width: 560px) {
    body { padding: 8px; }
    .shell { padding: 10px 10px 8px; border-radius: 18px; }
    .hud { gap: 12px; padding-bottom: 10px; }
    .stat { min-width: 44px; }
    .stat b { font-size: 17px; }
    #soundBtn { width: 36px; height: 36px; }
    .stage { border-radius: 12px; }
    .foot { display: none; }
  }
</style>
</head>
<body>
<main class="shell">
  <header class="hud">
    <div class="stat"><span>得分</span><b id="score">0</b></div>
    <div class="stat"><span>关卡</span><b id="level">01</b></div>
    <div class="stat"><span>最高</span><b id="best">0</b></div>
    <div class="stat lives"><span>生命</span><b id="lives"></b></div>
    <button id="soundBtn" type="button" aria-label="关闭声音" title="声音 (M)">🔊</button>
  </header>

  <div class="stage">
    <canvas id="game" width="800" height="600" aria-label="弹球游戏画面"></canvas>
    <div id="overlay" class="overlay visible" role="dialog" aria-modal="true">
      <div class="panel">
        <p class="tag" id="ovTag">NEON BOUNCE</p>
        <h1 id="ovTitle">弹球大师</h1>
        <p class="desc" id="ovText">挡板接住小球，打光所有砖块。连续通关，球速会越来越快。</p>
        <button class="primary" id="ovBtn" type="button">开始游戏</button>
        <p class="hint" id="ovHint">移动鼠标或手指控制挡板 · 空格 / 点击发球</p>
      </div>
    </div>
  </div>

  <footer class="foot">
    <span><kbd>鼠标</kbd> / <kbd>手指</kbd> 移动挡板</span>
    <span><kbd>空格</kbd> 发球 / 暂停</span>
    <span><kbd>P</kbd> 暂停</span>
    <span><kbd>M</kbd> 静音</span>
  </footer>
</main>

<script>
(() => {
  'use strict';

  // ---------- 基础设置 ----------
  const W = 800;
  const H = 600;
  const STEP = 1 / 120;
  const BEST_KEY = 'neon-bounce-best-v1';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const ui = {
    score: document.getElementById('score'),
    level: document.getElementById('level'),
    best: document.getElementById('best'),
    lives: document.getElementById('lives'),
    soundBtn: document.getElementById('soundBtn'),
    overlay: document.getElementById('overlay'),
    ovTag: document.getElementById('ovTag'),
    ovTitle: document.getElementById('ovTitle'),
    ovText: document.getElementById('ovText'),
    ovBtn: document.getElementById('ovBtn'),
    ovHint: document.getElementById('ovHint'),
  };

  const ROW_COLORS = ['#ff4d6d', '#ff9f43', '#ffd166', '#3ddc97', '#4cc9f0'];
  const COLS = 9;
  const ROWS = 5;
  const BRICK_H = 26;
  const BRICK_GAP = 8;
  const BRICK_TOP = 78;
  const BRICK_SIDE = 38;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;

  const state = {
    mode: 'menu',        // menu | playing | paused | levelclear | gameover
    score: 0,
    best: loadBest(),
    level: 1,
    lives: 3,
    launched: false,
    pending: null,
  };

  const paddle = {
    w: 118,
    h: 14,
    x: W / 2,
    y: H - 44,
    targetX: W / 2,
    vx: 0,
  };

  const ball = {
    x: W / 2,
    y: 0,
    r: 8,
    vx: 0,
    vy: 0,
    speed: 400,
    trail: [],
  };

  const keys = { left: false, right: false };
  let bricks = [];
  let particles = [];
  let stars = [];
  let shake = 0;
  let time = 0;
  let acc = 0;
  let last = performance.now();
  let muted = false;
  let audioCtx = null;

  // 缓存的渐变
  const bgGradient = ctx.createLinearGradient(0, 0, 0, H);
  bgGradient.addColorStop(0, '#0a1124');
  bgGradient.addColorStop(0.6, '#0b152c');
  bgGradient.addColorStop(1, '#0d1020');

  const bottomGlow = ctx.createRadialGradient(W / 2, H, 20, W / 2, H, 460);
  bottomGlow.addColorStop(0, 'rgba(76, 201, 240, 0.12)');
  bottomGlow.addColorStop(1, 'rgba(76, 201, 240, 0)');

  const brickFillCache = new Map();

  // ---------- 工具 ----------
  function clamp(v, min, max) { return v < min ? min : v > max ? max : v; }

  function loadBest() {
    try { return Number(localStorage.getItem(BEST_KEY)) || 0; }
    catch (e) { return 0; }
  }

  function saveBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 忽略隐私模式限制 */ }
  }

  function mixHex(hex, targetHex, amount) {
    const parse = (h) => {
      const s = h.replace('#', '');
      return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
    };
    const a = parse(hex);
    const b = parse(targetHex);
    const c = a.map((v, i) => Math.round(v + (b[i] - v) * amount));
    return 'rgb(' + c.join(',') + ')';
  }

  function roundRect(x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  // ---------- 声音 ----------
  function audio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function beep(freq, dur, type, vol) {
    if (muted) return;
    const a = audio();
    if (!a) return;
    try {
      const osc = a.createOscillator();
      const gain = a.createGain();
      const t = a.currentTime;
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol || 0.045, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.08));
      osc.connect(gain);
      gain.connect(a.destination);
      osc.start(t);
      osc.stop(t + (dur || 0.08) + 0.02);
    } catch (e) { /* 音频不可用时静默 */ }
  }

  function beepSequence(notes, gap, type, vol) {
    notes.forEach((f, i) => setTimeout(() => beep(f, 0.12, type, vol), i * gap));
  }

  // ---------- 界面 ----------
  function updateHUD() {
    ui.score.textContent = state.score;
    ui.best.textContent = state.best;
    ui.level.textContent = String(state.level).padStart(2, '0');
    let hearts = '';
    for (let i = 0; i < 3; i++) {
      hearts += '<span class="' + (i < state.lives ? 'on' : 'off') + '">♥</span>';
    }
    ui.lives.innerHTML = hearts;
  }

  function showOverlay(tag, title, text, btn, hint, action) {
    ui.ovTag.textContent = tag;
    ui.ovTitle.textContent = title;
    ui.ovText.textContent = text;
    ui.ovBtn.textContent = btn;
    ui.ovHint.textContent = hint || '';
    state.pending = action;
    ui.overlay.classList.add('visible');
  }

  function hideOverlay() {
    ui.overlay.classList.remove('visible');
    state.pending = null;
  }

  // ---------- 场景数据 ----------
  function buildStars() {
    stars = [];
    let seed = 20261110;
    const rand = () => {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
    for (let i = 0; i < 72; i++) {
      stars.push({
        x: rand() * W,
        y: rand() * H,
        r: 0.6 + rand() * 1.3,
        phase: rand() * Math.PI * 2,
        speed: 0.4 + rand() * 1.1,
      });
    }
  }

  function buildBricks() {
    bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const maxHp = r < 2 ? 2 : 1;
        bricks.push({
          x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          w: BRICK_W,
          h: BRICK_H,
          hp: maxHp,
          maxHp: maxHp,
          color: ROW_COLORS[r],
          row: r,
          alive: true,
        });
      }
    }
  }

  function setBallSpeed() {
    ball.speed = Math.min(640, 400 + (state.level - 1) * 35);
  }

  function resetBall() {
    ball.x = paddle.x;
    ball.y = paddle.y - ball.r - 2;
    ball.vx = 0;
    ball.vy = 0;
    ball.trail.length = 0;
    state.launched = false;
  }

  // ---------- 流程 ----------
  function startRun() {
    state.score = 0;
    state.lives = 3;
    state.level = 1;
    state.mode = 'playing';
    paddle.x = W / 2;
    paddle.targetX = W / 2;
    paddle.vx = 0;
    buildBricks();
    setBallSpeed();
    resetBall();
    updateHUD();
    hideOverlay();
    acc = 0;
    beepSequence([392, 523, 659], 70, 'triangle', 0.045);
  }

  function launchBall() {
    if (state.mode !== 'playing' || state.launched) return;
    const angle = (Math.random() * 2 - 1) * 0.22;
    ball.vx = Math.sin(angle) * ball.speed;
    ball.vy = -Math.cos(angle) * ball.speed;
    state.launched = true;
    beep(340, 0.07, 'triangle', 0.05);
  }

  function loseLife() {
    state.lives -= 1;
    updateHUD();
    shake = 14;
    beep(180, 0.16, 'sawtooth', 0.05);
    setTimeout(() => beep(120, 0.22, 'sawtooth', 0.05), 110);
    if (state.lives <= 0) {
      endGame();
    } else {
      resetBall();
    }
  }

  function endGame() {
    state.mode = 'gameover';
    if (state.score > state.best) {
      state.best = state.score;
      saveBest(state.best);
    }
    updateHUD();
    showOverlay(
      'GAME OVER',
      '游戏结束',
      '本局得分 ' + state.score + '，最高分 ' + state.best + '。',
      '再来一局',
      '按 R 快速重开',
      startRun
    );
  }

  function pauseGame() {
    if (state.mode !== 'playing') return;
    state.mode = 'paused';
    showOverlay('PAUSED', '已暂停', '休息一下，随时回来。', '继续游戏', '按 P 或空格继续', resumeGame);
  }

  function resumeGame() {
    if (state.mode !== 'paused') return;
    state.mode = 'playing';
    hideOverlay();
    acc = 0;
  }

  function levelClear() {
    state.mode = 'levelclear';
    beepSequence([523, 659, 784, 1047], 80, 'triangle', 0.045);
    showOverlay(
      'LEVEL CLEAR',
      '第 ' + state.level + ' 关完成',
      '当前得分 ' + state.score + '，下一关球速更快。',
      '进入第 ' + (state.level + 1) + ' 关',
      '',
      nextLevel
    );
  }

  function nextLevel() {
    state.level += 1;
    buildBricks();
    setBallSpeed();
    resetBall();
    state.mode = 'playing';
    updateHUD();
    hideOverlay();
    acc = 0;
  }

  // ---------- 得分与粒子 ----------
  function addScore(amount) {
    state.score += amount;
    if (state.score > state.best) {
      state.best = state.score;
      saveBest(state.best);
    }
    updateHUD();
  }

  function spawnParticles(x, y, color, count) {
    const n = count || 12;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 40 + Math.random() * 190;
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 60,
        life: 0.45 + Math.random() * 0.45,
        maxLife: 0.9,
        size: 1.8 + Math.random() * 2.4,
        color: color,
      });
    }
    if (particles.length > 280) particles.splice(0, particles.length - 280);
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.vy += 520 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 1 - 1.2 * dt;
    }
  }

  // ---------- 碰撞 ----------
  function circleRect(cx, cy, r, rx, ry, rw, rh) {
    const closestX = clamp(cx, rx, rx + rw);
    const closestY = clamp(cy, ry, ry + rh);
    const dx = cx - closestX;
    const dy = cy - closestY;
    const d2 = dx * dx + dy * dy;
    if (d2 > r * r) return null;

    if (d2 === 0) {
      const left = cx - rx;
      const right = rx + rw - cx;
      const top = cy - ry;
      const bottom = ry + rh - cy;
      const m = Math.min(left, right, top, bottom);
      if (m === left) return { nx: -1, ny: 0, pen: left + r };
      if (m === right) return { nx: 1, ny: 0, pen: right + r };
      if (m === top) return { nx: 0, ny: -1, pen: top + r };
      return { nx: 0, ny: 1, pen: bottom + r };
    }

    const d = Math.sqrt(d2);
    return { nx: dx / d, ny: dy / d, pen: r - d };
  }

  function reflect(nx, ny, pen) {
    ball.x += nx * (pen + 0.1);
    ball.y += ny * (pen + 0.1);
    const vn = ball.vx * nx + ball.vy * ny;
    if (vn < 0) {
      ball.vx -= 2 * vn * nx;
      ball.vy -= 2 * vn * ny;
    }
  }

  // ---------- 每帧逻辑 ----------
  function update(dt) {
    if (shake > 0) shake = Math.max(0, shake - dt * 40);

    // 挡板
    if (keys.left) paddle.targetX -= 820 * dt;
    if (keys.right) paddle.targetX += 820 * dt;
    const minX = paddle.w / 2 + 8;
    const maxX = W - paddle.w / 2 - 8;
    paddle.targetX = clamp(paddle.targetX, minX, maxX);
    const prevX = paddle.x;
    paddle.x += (paddle.targetX - paddle.x) * Math.min(1, dt * 26);
    paddle.x = clamp(paddle.x, minX, maxX);
    paddle.vx = clamp((paddle.x - prevX) / dt, -900, 900);

    // 球未发射时跟随挡板
    if (!state.launched) {
      ball.x = paddle.x;
      ball.y = paddle.y - ball.r - 2;
      ball.trail.length = 0;
      updateParticles(dt);
      return;
    }

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // 左右与顶部墙
    if (ball.x - ball.r < 0) {
      ball.x = ball.r;
      ball.vx = Math.abs(ball.vx);
    } else if (ball.x + ball.r > W) {
      ball.x = W - ball.r;
      ball.vx = -Math.abs(ball.vx);
    }
    if (ball.y - ball.r < 0) {
      ball.y = ball.r;
      ball.vy = Math.abs(ball.vy);
    }

    // 挡板反弹
    if (
      ball.vy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y - ball.r <= paddle.y + paddle.h &&
      ball.x + ball.r >= paddle.x - paddle.w / 2 &&
      ball.x - ball.r <= paddle.x + paddle.w / 2
    ) {
      ball.y = paddle.y - ball.r - 0.5;
      const offset = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
      const angle = offset * 1.02;
      const speed = ball.speed;
      ball.vx = Math.sin(angle) * speed + paddle.vx * 0.09;
      ball.vy = -Math.abs(Math.cos(angle) * speed);
      const len = Math.hypot(ball.vx, ball.vy) || 1;
      ball.vx = (ball.vx / len) * speed;
      ball.vy = (ball.vy / len) * speed;
      if (ball.vy > -60) ball.vy = -60;
      beep(224, 0.07, 'sine', 0.055);
      spawnParticles(ball.x, paddle.y, '#7ee7ff', 5);
    }

    // 砖块碰撞
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!b.alive) continue;
      const hit = circleRect(ball.x, ball.y, ball.r, b.x, b.y, b.w, b.h);
      if (!hit) continue;

      reflect(hit.nx, hit.ny, hit.pen);
      b.hp -= 1;
      const points = 10 * state.level * (b.maxHp === 2 ? 2 : 1);
      addScore(points);
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, b.color, b.hp <= 0 ? 14 : 6);
      shake = Math.min(8, shake + 2);
      beep(500 + (ROWS - b.row) * 46, 0.055, 'triangle', 0.045);

      if (b.hp <= 0) {
        b.alive = false;
        if (bricks.every((br) => !br.alive)) {
          levelClear();
          return;
        }
      }
      break;
    }

    // 掉出底部
    if (ball.y - ball.r > H + 6) {
      loseLife();
      return;
    }

    // 拖尾
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 16) ball.trail.shift();

    updateParticles(dt);
  }

  // ---------- 绘制 ----------
  function drawBackground() {
    ctx.fillStyle = bgGradient;
    ctx.fillRect(-30, -30, W + 60, H + 60);
    ctx.fillStyle = bottomGlow;
    ctx.fillRect(0, 0, W, H);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const alpha = 0.18 + 0.42 * (0.5 + 0.5 * Math.sin(time * s.speed + s.phase));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#bcd8ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function getBrickFill(color) {
    if (!brickFillCache.has(color)) {
      const g = ctx.createLinearGradient(0, 0, 0, BRICK_H);
      g.addColorStop(0, mixHex(color, '#ffffff', 0.42));
      g.addColorStop(0.55, color);
      g.addColorStop(1, mixHex(color, '#000000', 0.22));
      brickFillCache.set(color, g);
    }
    return brickFillCache.get(color);
  }

  function drawBricks() {
    for (let i = 0; i < bricks.length; i++) {
      const b = bricks[i];
      if (!b.alive) continue;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.fillStyle = getBrickFill(b.color);
      ctx.globalAlpha = b.hp < b.maxHp ? 0.82 : 1;
      roundRect(0, 0, b.w, b.h, 7);
      ctx.fill();
      ctx.globalAlpha = 1;

      if (b.maxHp === 2 && b.hp === 2) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.34)';
        ctx.lineWidth = 1;
        roundRect(1.5, 1.5, b.w - 3, b.h - 3, 6);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawPaddle() {
    const g = ctx.createLinearGradient(paddle.x - paddle.w / 2, 0, paddle.x + paddle.w / 2, 0);
    g.addColorStop(0, '#7ee7ff');
    g.addColorStop(0.5, '#6ea8ff');
    g.addColorStop(1, '#a78bfa');

    ctx.save();
    ctx.shadowColor = 'rgba(76, 201, 240, 0.75)';
    ctx.shadowBlur = 18;
    ctx.fillStyle = g;
    roundRect(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    roundRect(paddle.x - paddle.w / 2 + 6, paddle.y + 2, paddle.w - 12, 2, 1);
    ctx.fill();
    ctx.restore();
  }

  function drawBall() {
    // 拖尾
    for (let i = 0; i < ball.trail.length; i++) {
      const t = ball.trail[i];
      const k = (i + 1) / ball.trail.length;
      ctx.globalAlpha = k * 0.22;
      ctx.fillStyle = '#7ee7ff';
      ctx.beginPath();
      ctx.arc(t.x, t.y, ball.r * (0.3 + 0.6 * k), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 光晕
    const glow = ctx.createRadialGradient(ball.x, ball.y, 1, ball.x, ball.y, ball.r * 4);
    glow.addColorStop(0, 'rgba(160, 240, 255, 0.55)');
    glow.addColorStop(1, 'rgba(76, 201, 240, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r * 4, 0, Math.PI * 2);
    ctx.fill();

    // 球体
    const core = ctx.createRadialGradient(ball.x - 2, ball.y - 3, 1, ball.x, ball.y, ball.r);
    core.addColorStop(0, '#ffffff');
    core.addColorStop(0.55, '#b9f1ff');
    core.addColorStop(1, '#4cc9f0');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawParticles() {
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function render() {
    ctx.save();
    if (shake > 0.1) {
      ctx.translate((Math.random() * 2 - 1) * shake, (Math.random() * 2 - 1) * shake);
    }
    drawBackground();
    drawBricks();
    drawParticles();
    drawPaddle();
    drawBall();
    ctx.restore();
  }

  // ---------- 主循环 ----------
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;

    if (state.mode === 'playing') {
      acc += dt;
      let guard = 0;
      while (acc >= STEP && guard < 8) {
        update(STEP);
        acc -= STEP;
        guard += 1;
        if (state.mode !== 'playing') break;
      }
    }

    render();
    requestAnimationFrame(frame);
  }

  // ---------- 输入 ----------
  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    return clamp(((e.clientX - rect.left) / rect.width) * W, 0, W);
  }

  canvas.addEventListener('pointermove', (e) => {
    if (state.mode === 'playing' || state.mode === 'paused') {
      paddle.targetX = pointerX(e);
    }
  });

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.mode === 'playing') {
      paddle.targetX = pointerX(e);
      if (!state.launched) launchBall();
    }
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('keydown', (e) => {
    const code = e.code;
    if (code === 'ArrowLeft' || code === 'KeyA') {
      keys.left = true;
      e.preventDefault();
    } else if (code === 'ArrowRight' || code === 'KeyD') {
      keys.right = true;
      e.preventDefault();
    } else if (code === 'Space') {
      e.preventDefault();
      if (e.repeat) return;
      if (ui.overlay.classList.contains('visible')) {
        if (state.pending) state.pending();
      } else if (state.mode === 'playing') {
        if (!state.launched) launchBall();
        else pauseGame();
      }
    } else if (code === 'KeyP') {
      if (e.repeat) return;
      if (state.mode === 'playing') pauseGame();
      else if (state.mode === 'paused') resumeGame();
    } else if (code === 'KeyM') {
      toggleSound();
    } else if (code === 'KeyR') {
      if (state.mode === 'gameover') startRun();
    }
  });

  window.addEventListener('keyup', (e) => {
    const code = e.code;
    if (code === 'ArrowLeft' || code === 'KeyA') keys.left = false;
    if (code === 'ArrowRight' || code === 'KeyD') keys.right = false;
  });

  function toggleSound() {
    muted = !muted;
    ui.soundBtn.textContent = muted ? '🔇' : '🔊';
    ui.soundBtn.setAttribute('aria-label', muted ? '开启声音' : '关闭声音');
    if (!muted) beep(660, 0.08, 'sine', 0.05);
  }

  ui.soundBtn.addEventListener('click', () => {
    toggleSound();
    ui.soundBtn.blur();
  });

  ui.ovBtn.addEventListener('click', () => {
    ui.ovBtn.blur();
    if (state.pending) state.pending();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.mode === 'playing') pauseGame();
  });

  window.addEventListener('blur', () => {
    keys.left = false;
    keys.right = false;
  });

  // ---------- 启动 ----------
  buildStars();
  buildBricks();
  resetBall();
  updateHUD();
  ui.lives.innerHTML = '<span class="on">♥</span><span class="on">♥</span><span class="on">♥</span>';
  showOverlay(
    'NEON BOUNCE',
    '弹球大师',
    '挡板接住小球，打光所有砖块。连续通关，球速会越来越快。',
    '开始游戏',
    '移动鼠标或手指控制挡板 · 空格 / 点击发球',
    startRun
  );

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
